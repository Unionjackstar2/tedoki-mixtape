name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Release-Schlüssel vorbereiten
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Kein KEYSTORE_BASE64-Secret – APK wird mit Debug-Schlüssel signiert."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Alias automatisch ermitteln, falls kein KEY_ALIAS-Secret gesetzt ist
          if [ -z "$KEY_ALIAS" ]; then
            KEY_ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
              | grep -iE "PrivateKeyEntry" | head -n1 | cut -d',' -f1)
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Konnte den Schlüssel-Alias nicht lesen – Passwort prüfen oder KEY_ALIAS-Secret anlegen."
            exit 1
          fi
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
          echo "Schlüssel-Alias: $KEY_ALIAS"

      - name: APK bauen
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-configuration-cache --stacktrace

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/TEDOKI-Mixtape-1.0-build${{ github.run_number }}.apk"
          ls -la out

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: TEDOKI-Mixtape-build${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
