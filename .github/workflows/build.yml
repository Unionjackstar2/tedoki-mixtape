name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Code holen
        uses: actions/checkout@v4

      # Findet das Projekt: entweder direkt im Repo – oder in einer hochgeladenen ZIP-Datei,
      # die hier automatisch entpackt wird. So reicht es, nur die ZIP ins Repo zu legen.
      - name: Projekt finden (Ordner oder ZIP)
        run: |
          echo "Inhalt des Repos:"; ls -la
          SETTINGS=$(find . -maxdepth 3 -name settings.gradle.kts -not -path "./.git/*" | head -n1)
          if [ -z "$SETTINGS" ]; then
            ZIPS=$(find . -maxdepth 1 -name "*.zip" | sort)
            COUNT=$(echo "$ZIPS" | grep -c . || true)
            if [ "$COUNT" -eq 0 ]; then
              echo "::error::Weder settings.gradle.kts noch eine ZIP-Datei im Repo gefunden."
              exit 1
            fi
            if [ "$COUNT" -gt 1 ]; then
              echo "::error::Mehrere ZIP-Dateien im Repo – bitte nur eine drin lassen: $ZIPS"
              exit 1
            fi
            echo "Entpacke $ZIPS ..."
            unzip -q "$ZIPS" -d _src
            SETTINGS=$(find _src -maxdepth 3 -name settings.gradle.kts | head -n1)
            if [ -z "$SETTINGS" ]; then
              echo "::error::In der ZIP-Datei ist keine settings.gradle.kts."
              exit 1
            fi
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Projektordner: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Das Android SDK ist auf den GitHub-Runnern schon vorinstalliert.
      # Fehlende Teile (z. B. Plattform 36.1) laedt Gradle beim Build selbst nach.
      - name: Android-SDK-Lizenzen bestaetigen
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          echo "Verwende $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Release-Schlüssel vorbereiten
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Kein KEYSTORE_BASE64-Secret – APK wird mit Debug-Schlüssel signiert."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Alias automatisch ermitteln, falls kein KEY_ALIAS-Secret gesetzt ist
          if [ -z "$KEY_ALIAS" ]; then
            KEY_ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
              | grep -iE "PrivateKeyEntry" | head -n1 | cut -d',' -f1)
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Konnte den Schlüssel-Alias nicht lesen – Passwort prüfen oder KEY_ALIAS-Secret anlegen."
            exit 1
          fi
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
          echo "Schlüssel-Alias: $KEY_ALIAS"

      - name: APK bauen
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle -p "$PROJECT_DIR" :app:assembleRelease --no-configuration-cache --stacktrace

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk "out/TEDOKI-Mixtape-1.0-build${{ github.run_number }}.apk"
          ls -la out

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: TEDOKI-Mixtape-build${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
